---
- name: Deploy Dashboard
  hosts: infra_dashboard
  become: true

  handlers:
    - name: Include handlers.
      ansible.builtin.import_tasks: handlers/main.yml

  pre_tasks:
    # Lab VMs get Docker from the Packer template; the VPS doesn't. First, so
    # it's in place before the common role starts the log shipper
    # (roles/vector), a container.
    - name: Install Docker.
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 1800

    - name: Include common prerequisites.
      ansible.builtin.include_role:
        name: common

  tasks:
    - name: Configure Tailscale.
      ansible.builtin.include_role:
        name: tailscale

    - name: Configure node-exporter.
      ansible.builtin.include_tasks: tasks/node-exporter.yml

    - name: Configure Uptime Kuma.
      ansible.builtin.include_tasks: tasks/uptime-kuma.yml

    - name: Configure Grafana.
      ansible.builtin.include_tasks: tasks/grafana.yml

    - name: Configure Kanidm.
      ansible.builtin.include_tasks: tasks/kanidm.yml

    - name: Configure Homepage.
      ansible.builtin.include_tasks: tasks/homepage.yml
