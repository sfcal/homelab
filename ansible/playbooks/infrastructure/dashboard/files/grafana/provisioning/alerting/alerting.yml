            datasourceUid: __expr__
            model: {refId: B, type: math, expression: $A < 1}
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels: {site: ldn}
        annotations:
          summary: Grafana on the VPS cannot query ldn's Prometheus (10.3.20.30:9090). The site, its tailnet link or the monitoring VM is down.

      - uid: ldn-target-down
        title: Target down (ldn)
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus-ldn
            model:
              refId: A
