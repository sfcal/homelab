---
# Config files are bind-mounted, so compose can't see their changes: restart
# Homepage. Compose/image changes are applied by `state: present` in the tasks.
- name: Restart homepage
  community.docker.docker_compose_v2:
    project_src: /opt/dashboard
    state: restarted
    services:
      - homepage

- name: Restart caddy
  community.docker.docker_compose_v2:
    project_src: /opt/dashboard
    state: restarted
    services:
      - caddy

- name: Restart grafana
  community.docker.docker_compose_v2:
    project_src: /opt/dashboard
    state: restarted
    services:
      - grafana

- name: Restart kanidm
  community.docker.docker_compose_v2:
    project_src: /opt/dashboard
    state: restarted
    services:
      - kanidm

# Compose builds Caddy's image only when it's missing: rebuild it when its
# Dockerfile changes.
- name: Rebuild caddy
  community.docker.docker_compose_v2:
    project_src: /opt/dashboard
    build: always
    state: present
    services:
      - caddy
