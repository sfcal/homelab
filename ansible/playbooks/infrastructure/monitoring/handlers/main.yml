---
# Config files are bind-mounted, so compose can't see their changes: restart
# just the service that reads them. Compose/image changes are applied by
# `state: present` in the tasks.
- name: Restart prometheus
  community.docker.docker_compose_v2:
    project_src: "/opt/monitoring"
    state: restarted
    services:
      - prometheus

- name: Restart grafana
  community.docker.docker_compose_v2:
    project_src: "/opt/monitoring"
    state: restarted
    services:
      - grafana

- name: Restart monitoring-stack
  community.docker.docker_compose_v2:
    project_src: "/opt/monitoring"
    state: restarted

- name: Stop monitoring-stack
  community.docker.docker_compose_v2:
    project_src: "/opt/monitoring"
    state: stopped

- name: Start monitoring-stack
  community.docker.docker_compose_v2:
    project_src: "/opt/monitoring"
    state: present
