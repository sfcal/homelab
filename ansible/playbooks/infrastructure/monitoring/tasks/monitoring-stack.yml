---
- name: Create monitoring-stack directory structure.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: "0755"
  loop:
    # Rendered config under /opt, container state under /var/lib. Prometheus's
    # data directory is made by the next task, owned by the user Prometheus
    # runs as: listed here too, its owner flipped to root and back on every
    # deploy.
    - "/opt/monitoring"
    - "/opt/monitoring/prometheus"
    - "/var/lib/monitoring"
    - "/var/lib/monitoring/uptime-kuma"

- name: Set ownership on Prometheus data directory.
  ansible.builtin.file:
    path: "/var/lib/monitoring/prometheus"
    state: directory
    owner: "{{ monitoring_uid }}"
    group: "{{ monitoring_gid }}"
    recurse: true

- name: Deploy Prometheus configuration.
  ansible.builtin.template:
    src: templates/prometheus.yml.j2
    dest: "/opt/monitoring/prometheus/prometheus.yml"
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: "0644"
  notify:
    - Restart prometheus

- name: Deploy compose.yaml.
  ansible.builtin.template:
    src: templates/compose.yaml.j2
    dest: "/opt/monitoring/compose.yaml"
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: "0644"

# `compose up` recreates only services whose definition/image changed, and
# stops services no longer in compose.yaml (Homepage and Grafana moved to the
# dashboard VPS).
- name: Ensure Monitoring Stack is running.
  community.docker.docker_compose_v2:
    project_src: "/opt/monitoring"
    state: present
    remove_orphans: true
  register: monitoring_stack_output

- name: Display Monitoring Stack status.
  ansible.builtin.debug:
    var: monitoring_stack_output