---
- name: Install BIND9.
  ansible.builtin.apt:
    name:
      - bind9
      - bind9utils
      - bind9-doc
    state: present

- name: Deploy BIND9 main configuration.
  ansible.builtin.template:
    src: "templates/named.conf.j2"
    dest: "/etc/bind/named.conf"
    owner: bind
    group: bind
    mode: 0644
    # Checked before it replaces the live file: a config named would refuse
    # stops the play here and DNS keeps running on the old one.
    validate: named-checkconf %s
  notify:
    - Restart bind9

# The serial is the time of the deploy, so the zone files change on every run:
# reload them (no restart, the resolver cache stays). -i local is the check
# named itself runs when it loads a zone (no lookups of outside names).
- name: Deploy BIND9 zone files per domain.
  ansible.builtin.template:
    src: "templates/domain.zone.j2"
    dest: "/etc/bind/domain-{{ current_domain.name }}.zone"
    owner: bind
    group: bind
    mode: 0644
    validate: "named-checkzone -i local {{ current_domain.name }} %s"
  loop: "{{ domains }}"
  loop_control:
    loop_var: current_domain
  notify:
    - Reload bind9

- name: Deploy BIND9 reverse zone.
  ansible.builtin.template:
    src: "templates/reverse.zone.j2"
    dest: "/etc/bind/{{ dns_reverse_zone }}.zone"
    owner: bind
    group: bind
    mode: 0644
    validate: "named-checkzone -i local {{ dns_reverse_zone }} %s"
  notify:
    - Reload bind9

- name: Ensure BIND9 is running and enabled.
  ansible.builtin.service:
    name: bind9
    state: started
    enabled: true
