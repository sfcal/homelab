---
- name: Create authelia directories.
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/authelia, mode: "0755" }      # compose.yaml and rendered config
    - { path: /var/lib/authelia, mode: "0700" }  # database and one-time codes

- name: Deploy Authelia configuration.
  ansible.builtin.template:
    src: "templates/authelia-{{ item }}.j2"
    dest: "/opt/authelia/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - configuration.yml
    - users.yml
    - oauth2-proxy.env
  notify:
    - Restart authelia

- name: Create the external caddy docker network.
  community.docker.docker_network:
    name: caddy
    state: present

- name: Deploy Authelia.
  ansible.builtin.include_role:
    name: docker_service
  vars:
    service_name: authelia
    service_compose_template: templates/authelia-compose.yaml.j2
    service_images:
      - "{{ authelia_image }}"
      - "{{ oauth2_proxy_image }}"
