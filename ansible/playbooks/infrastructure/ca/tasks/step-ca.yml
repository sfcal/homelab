---
- name: Create step-ca directory structure.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "/opt/step-ca"
    - "/var/lib/step-ca"
    - "/var/lib/step-ca/data"

- name: Set ownership on step-ca data directory.
  ansible.builtin.file:
    path: "/var/lib/step-ca/data"
    owner: "{{ step_ca_uid }}"
    group: "{{ step_ca_gid }}"
    recurse: true

- name: Deploy provisioner password file.
  ansible.builtin.copy:
    content: "{{ step_ca_provisioner_password }}"
    dest: "/opt/step-ca/password.txt"
    owner: "{{ step_ca_uid }}"
    group: "{{ step_ca_gid }}"
    mode: "0600"
  no_log: true

- name: Deploy compose.yaml.
  ansible.builtin.template:
    src: templates/compose.yaml.j2
    dest: "/opt/step-ca/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart step-ca

- name: Ensure step-ca is running.
  community.docker.docker_compose_v2:
    project_src: "/opt/step-ca"
    state: present
  register: step_ca_output

- name: Wait for step-ca to initialize.
  ansible.builtin.pause:
    seconds: 10
  when: step_ca_output.changed

- name: Check step-ca health.
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ step_ca_port }}/health"
    validate_certs: false
  register: step_ca_health
  retries: 5
  delay: 3
  until: step_ca_health.status == 200

# --- Chain from the YubiKey root ---
# files/root_ca.crt is the one root for every site (task ca:root-init) and
# files/intermediate_ca_<site>.crt is this site's intermediate, signed by it
# (task ca:sign-intermediate, which also leaves the new key on the CA as
# secrets/intermediate_ca_key.new). Nothing is switched unless the key on the
# CA matches the certificate. A site with no signed intermediate yet keeps the
# chain step-ca made for itself on first start.
- name: Install the chain signed by the YubiKey root.
  when: (playbook_dir + '/files/intermediate_ca_' + site + '.crt') is file
  block:
    - name: Create the staging directory for the chain.
      ansible.builtin.file:
        path: "/var/lib/step-ca/data/chain"
        state: directory
        owner: "{{ step_ca_uid }}"
        group: "{{ step_ca_gid }}"
        mode: "0755"

    - name: Stage the root and this site's intermediate.
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/var/lib/step-ca/data/chain/{{ item.dest }}"
        owner: "{{ step_ca_uid }}"
        group: "{{ step_ca_gid }}"
        mode: "0644"
      loop:
        - { src: "files/root_ca.crt", dest: "root_ca.crt" }
        - { src: "files/intermediate_ca_{{ site }}.crt", dest: "intermediate_ca.crt" }

    - name: Switch to the staged chain once the intermediate key matches it.
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - step-ca
          - sh
          - -ec
          - |
            cd /home/step
            key=secrets/intermediate_ca_key
            pub() { step crypto key public --password-file secrets/password "$1"; }
            want=$(step crypto key public chain/intermediate_ca.crt)
            if [ -f $key.new ] && [ "$(pub $key.new)" = "$want" ]; then
              mv $key.new $key
              echo switched
            fi
            if [ "$(pub $key)" != "$want" ]; then
              echo "The intermediate key on this CA does not match files/intermediate_ca_{{ site }}.crt: run task ca:sign-intermediate ENV={{ site }} again." >&2
              exit 1
            fi
            for c in root_ca intermediate_ca; do
              if ! cmp -s chain/$c.crt certs/$c.crt; then
                cp chain/$c.crt certs/$c.crt
                echo switched
              fi
            done
            # The old self-made root is no longer the root: drop its key.
            rm -f secrets/root_ca_key
            fp=$(step certificate fingerprint certs/root_ca.crt)
            if [ "$(jq -r .fingerprint config/defaults.json)" != "$fp" ]; then
              jq --arg fp "$fp" '.fingerprint = $fp' config/defaults.json > config/defaults.json.tmp
              mv config/defaults.json.tmp config/defaults.json
              echo switched
            fi
      register: ca_chain_switch
      changed_when: "'switched' in ca_chain_switch.stdout"
      notify: Restart step-ca

# The two tasks below replace ca.json only when their setting isn't in it yet
# (jq compares its result with the file), so a deploy that changes nothing
# leaves the CA running instead of restarting it.
- name: Configure certificate duration claims.
  ansible.builtin.shell:
    cmd: |
      set -e
      cd /var/lib/step-ca/data/config
      jq '.authority.claims = {
        "minTLSCertDuration": "5m",
        "maxTLSCertDuration": "{{ step_ca_max_cert_duration | default('17520h') }}",
        "defaultTLSCertDuration": "{{ step_ca_default_cert_duration | default('720h') }}"
      }' ca.json > ca.json.tmp
      if jq -e --slurpfile new ca.json.tmp '. == $new[0]' ca.json > /dev/null; then
        rm ca.json.tmp
      else
        mv ca.json.tmp ca.json
        chown {{ step_ca_uid }}:{{ step_ca_gid }} ca.json
        echo changed
      fi
  register: ca_claims_update
  changed_when: "'changed' in ca_claims_update.stdout"
  notify: Restart step-ca

- name: Add ACME provisioner.
  ansible.builtin.shell:
    cmd: |
      set -e
      cd /var/lib/step-ca/data/config
      jq 'if any(.authority.provisioners[]?; .type == "ACME") then . else .authority.provisioners += [{"type": "ACME", "name": "acme"}] end' ca.json > ca.json.tmp
      if jq -e --slurpfile new ca.json.tmp '. == $new[0]' ca.json > /dev/null; then
        rm ca.json.tmp
      else
        mv ca.json.tmp ca.json
        chown {{ step_ca_uid }}:{{ step_ca_gid }} ca.json
        echo changed
      fi
  register: ca_acme_update
  changed_when: "'changed' in ca_acme_update.stdout"
  notify: Restart step-ca

- name: Flush handlers to apply config changes.
  ansible.builtin.meta: flush_handlers

- name: Wait for step-ca to restart after config change.
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ step_ca_port }}/health"
    validate_certs: false
  retries: 5
  delay: 3
  register: step_ca_restart_health
  until: step_ca_restart_health.status == 200

- name: Export root CA certificate.
  ansible.builtin.command:
    cmd: docker exec step-ca cat /home/step/certs/root_ca.crt
  register: root_ca_cert
  changed_when: false

- name: Save root CA certificate locally.
  ansible.builtin.copy:
    content: "{{ root_ca_cert.stdout }}"
    dest: "/opt/step-ca/root_ca.crt"
    owner: root
    group: root
    mode: "0644"

- name: Display step-ca status.
  ansible.builtin.debug:
    msg:
      - "Step-CA is running at https://{{ step_ca_dns_names.split(',') | first }}:{{ step_ca_port }}"
      - "Root CA cert available at /opt/step-ca/root_ca.crt"
      - "ACME directory: https://{{ step_ca_dns_names.split(',') | first }}:{{ step_ca_port }}/acme/acme/directory"
      - "Cert Warden UI: http://{{ step_ca_dns_names.split(',') | first }}:{{ certwarden_port }}"
      - "Health check: {{ step_ca_health.json }}"
