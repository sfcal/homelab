---
- name: Create romm directory structure.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ romm_user }}"
    group: "{{ romm_group }}"
    mode: "0755"
  loop:
    - "{{ romm_deploy_path }}"
    - "{{ romm_deploy_path }}/config"
    - "{{ romm_data_path }}"
    - "{{ romm_data_path }}/resources"
    - "{{ romm_data_path }}/redis"
    - "{{ romm_data_path }}/assets"
    - "{{ romm_library_path }}/roms"   # roms/<platform>/<game>
    - "{{ romm_library_path }}/roms/gc"   # GameCube (RomM alias of ngc): the folder Pegasus scans
    - "{{ romm_library_path }}/roms/wii"  # Wii
    - "{{ romm_library_path }}/bios"   # bios/<platform>

# MariaDB chowns its datadir to its own user (999) on first start; enforcing
# owner/mode here would hand the live datadir back to root on every run.
- name: Create the romm database directory.
  ansible.builtin.file:
    path: "{{ romm_data_path }}/db"
    state: directory

- name: Deploy romm config.yml.
  ansible.builtin.template:
    src: templates/romm-config.yml.j2
    dest: "{{ romm_deploy_path }}/config/config.yml"
    owner: "{{ romm_user }}"
    group: "{{ romm_group }}"
    mode: "0644"
  notify:
    - Restart romm

- name: Deploy romm compose.yaml.
  ansible.builtin.template:
    src: templates/romm-compose.yaml.j2
    dest: "{{ romm_deploy_path }}/compose.yaml"
    owner: "{{ romm_user }}"
    group: "{{ romm_group }}"
    mode: "0644"
  notify:
    - Restart romm

- name: Ensure RomM is running.
  community.docker.docker_compose_v2:
    project_src: "{{ romm_deploy_path }}"
    state: present
  register: romm_output

- name: Display RomM status.
  ansible.builtin.debug:
    var: romm_output
