---
- name: Deploy Gaming (Wolf, RomM)
  hosts: app_gaming
  become: true

  handlers:
    - name: Include various service handlers.
      ansible.builtin.import_tasks: handlers/main.yml

  pre_tasks:
    - name: Include common prerequisites.
      ansible.builtin.include_role:
        name: common

  tasks:
    # Game data (the ROM library) is local to the VM unless
    # group_vars/site_<site>/app_gaming/ sets gaming_nfs: true; it then mounts
    # the site's nfs_mounts (group_vars/site_<site>/nfs.yml). Not gated on
    # nfs_mounts itself: wil's media mount reaches every wil host.
    - name: Configure NFS mounts.
      ansible.builtin.include_role:
        name: nfs_mount
      when: gaming_nfs | default(false)

    # Each stack is deployed only where group_vars/site_<site>/app_gaming/vars.yml
    # defines its image: RomM and Wolf, both on ldn.
    - name: Configure RomM.
      ansible.builtin.include_tasks: tasks/romm.yml
      when: romm_image is defined

    - name: Configure Wolf.
      ansible.builtin.include_tasks: tasks/wolf.yml
      when: wolf_image is defined
