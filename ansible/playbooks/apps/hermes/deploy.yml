---
# Hermes runs on the Mac mini in wil, in two containers that OrbStack runs as
# the user smithers. Nothing here needs root, and the common role (apt) is
# skipped. Done once by hand (docs/infrastructure/hermes.md): install
# OrbStack at the Mac's desktop, and sign in to Claude in the container:
#   docker exec -it -u hermes hermes claude auth login
- name: Deploy Hermes Agent
  hosts: app_hermes
  become: false

  # ssh gives a bare PATH. OrbStack keeps docker under ~/.orbstack: its link
  # at /var/run/docker.sock would need root.
  environment:
    PATH: /Users/smithers/.orbstack/bin:/usr/bin:/bin:/usr/sbin:/sbin
    DOCKER_HOST: unix:///Users/smithers/.orbstack/run/docker.sock

  handlers:
    - name: Restart hermes
      community.docker.docker_compose_v2:
        project_src: /Users/smithers/hermes
        services:
          - hermes
        state: restarted

    - name: Restart node-exporter
      ansible.builtin.shell: launchctl kickstart -k gui/$(id -u)/cloud.5am.node-exporter

  tasks:
    - name: Check that OrbStack is running.
      ansible.builtin.command: docker info
      register: hermes_docker
      changed_when: false
      failed_when: false

    - name: Stop if it isn't.
      ansible.builtin.assert:
        that: hermes_docker.rc == 0
        fail_msg: >-
          Install OrbStack by hand first, at the Mac's desktop, and leave it
          running (docs/infrastructure/hermes.md).

    # The shared docker_service role isn't used: it writes to /opt as root.
    - name: Create the folder for compose.yaml.
      ansible.builtin.file:
        path: /Users/smithers/hermes
        state: directory
        mode: "0755"

    - name: Create the data folder (it holds logins and keys).
      ansible.builtin.file:
        path: /Users/smithers/hermes/data
        state: directory
        mode: "0700"

    - name: Write compose.yaml.
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/compose.yaml.j2"
        dest: /Users/smithers/hermes/compose.yaml
        mode: "0644"

    # No restart on a compose or image change: `compose up` pulls a missing
    # image and recreates only the services whose definition changed.
    - name: Start Hermes and the web UI.
      community.docker.docker_compose_v2:
        project_src: /Users/smithers/hermes
        state: present

    - name: Wait for Hermes to set up its data folder.
      ansible.builtin.wait_for:
        path: /Users/smithers/hermes/data/gateway.pid

    # Claude Code and the plugin live in the data folder, so a new image
    # keeps them. Each deploy moves both to their current release.
    # npm 12 skips Claude Code's install step unless --allow-scripts names it.
    - name: Install or update Claude Code.
      ansible.builtin.command: >-
        docker exec -u hermes hermes npm install -g --prefix /opt/data/.local
        --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@latest
      changed_when: false

    # First deploy only: `hermes model` can change the model afterwards.
    - name: Install the Claude subscription plugin and select it.
      ansible.builtin.shell:
        cmd: >-
          docker exec hermes hermes plugins install claude-subscription-directsdk &&
          docker exec hermes hermes config set model.provider claude-subscription-directsdk-experimental &&
          docker exec hermes hermes config set model.default claude-opus-5-5
        creates: /Users/smithers/hermes/data/plugins/claude-subscription-directsdk-experimental
      notify: Restart hermes

    - name: Update the Claude subscription plugin.
      ansible.builtin.command: docker exec hermes hermes plugins update claude-subscription-directsdk-experimental
      register: hermes_plugin_update
      changed_when: "'already at' not in hermes_plugin_update.stdout"
      notify: Restart hermes

    - name: Install the plex-fix skill.
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/plex-fix/"
        dest: /Users/smithers/hermes/data/skills/media/plex-fix/
        mode: "0644"
        directory_mode: "0755"
      notify: Restart hermes

    - name: Give Hermes the Radarr, Sonarr and Plex credentials.
      ansible.builtin.lineinfile:
        path: /Users/smithers/hermes/data/.env
        regexp: "^{{ item.name }}="
        line: "{{ item.name }}={{ item.value }}"
      loop:
        - { name: RADARR_API_KEY, value: "{{ hermes_radarr_api_key }}" }
        - { name: SONARR_API_KEY, value: "{{ hermes_sonarr_api_key }}" }
        - { name: PLEX_TOKEN, value: "{{ hermes_plex_token }}" }
      no_log: true
      notify: Restart hermes

    - name: Install the fastmail-triage skill.
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/fastmail-triage/"
        dest: /Users/smithers/hermes/data/skills/email/fastmail-triage/
        mode: "0644"
        directory_mode: "0755"
      notify: Restart hermes

    - name: Create the fastmail-triage data directory.
      ansible.builtin.file:
        path: /Users/smithers/hermes/data/data/fastmail-triage
        state: directory
        mode: "0700"

    # Addresses and senders that stay out of this public repo. The Fastmail
    # token isn't here: it's set by hand and stays on the Mac.
    - name: Give fastmail-triage its private settings.
      ansible.builtin.copy:
        content: "{{ hermes_fastmail_site_config | to_nice_json }}\n"
        dest: /Users/smithers/hermes/data/data/fastmail-triage/site-config.json
        mode: "0600"
      no_log: true

    # Keeps any schedule or pause set on the Mac. Only the report's
    # destination comes from group_vars.
    - name: Create or repair the fastmail-triage cron jobs.
      ansible.builtin.command: >-
        docker exec -u hermes hermes python3
        /opt/data/skills/email/fastmail-triage/scripts/install.py
        --deliver {{ hermes_fastmail_deliver }}
      changed_when: false

    - name: Install the grist skill.
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/grist/"
        dest: /Users/smithers/hermes/data/skills/productivity/grist/
        mode: "0644"
        directory_mode: "0755"
      notify: Restart hermes

    # Grist's own port on ldn's work VM: its name has the Kanidm login in
    # front, which a script can't pass. The API key isn't here: it's set by
    # hand and stays on the Mac (see the docs).
    - name: Tell Hermes where Grist is.
      ansible.builtin.lineinfile:
        path: /Users/smithers/hermes/data/.env
        regexp: "^GRIST_URL="
        line: "GRIST_URL=http://{{ groups['app_work'] | first }}:{{ hermes_grist_port }}"
      notify: Restart hermes

    # A seat belt, not a hard limit: it only sees terminal commands, and the
    # keys above can still delete anything.
    - name: Block delete calls to the media server.
      ansible.builtin.command: >-
        docker exec hermes hermes config set approvals.deny
        '["*DELETE*10.2.0.5*", "*10.2.0.5*DELETE*"]'
      changed_when: false

    # --- node-exporter ---
    # Runs on macOS itself, not in a container: it measures the Mac. wil's
    # Prometheus scrapes every host of the site on :9100. macOS has no
    # package for it, so this is the project's own release. It answers while
    # smithers is logged in: a Mac that is off, asleep or waiting at the
    # unlock screen raises Target down.
    - name: Create the folders for node-exporter's release and its link.
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /Users/smithers/.local/share
        - /Users/smithers/.local/bin

    - name: Download node-exporter.
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ hermes_node_exporter_version }}/node_exporter-{{ hermes_node_exporter_version }}.darwin-arm64.tar.gz"
        dest: "/Users/smithers/.local/share/node_exporter-{{ hermes_node_exporter_version }}.darwin-arm64.tar.gz"
        checksum: "sha256:{{ hermes_node_exporter_sha256 }}"
        mode: "0644"

    - name: Unpack node-exporter.
      ansible.builtin.command:
        cmd: "tar -xzf node_exporter-{{ hermes_node_exporter_version }}.darwin-arm64.tar.gz"
        chdir: /Users/smithers/.local/share
        creates: "/Users/smithers/.local/share/node_exporter-{{ hermes_node_exporter_version }}.darwin-arm64/node_exporter"

    - name: Point node_exporter at this release.
      ansible.builtin.file:
        src: "/Users/smithers/.local/share/node_exporter-{{ hermes_node_exporter_version }}.darwin-arm64/node_exporter"
        dest: /Users/smithers/.local/bin/node_exporter
        state: link
      notify: Restart node-exporter

    - name: Install node-exporter's service.
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/cloud.5am.node-exporter.plist"
        dest: /Users/smithers/Library/LaunchAgents/cloud.5am.node-exporter.plist
        mode: "0644"
      notify: Restart node-exporter

    # A service loaded over ssh lands in the background session (user/<uid>).
    # The desktop session (gui/<uid>) is where macOS itself loads it after a
    # restart, and where the restart handler looks for it. The pause lets the
    # old process exit, or the load fails.
    - name: Run node-exporter in the desktop session.
      ansible.builtin.shell: |
        uid=$(id -u)
        if launchctl print user/$uid/cloud.5am.node-exporter >/dev/null 2>&1; then
          launchctl bootout user/$uid/cloud.5am.node-exporter && echo moved
          sleep 3
        fi
        if ! launchctl print gui/$uid/cloud.5am.node-exporter >/dev/null 2>&1; then
          launchctl bootstrap gui/$uid /Users/smithers/Library/LaunchAgents/cloud.5am.node-exporter.plist && echo started
        fi
      register: hermes_node_exporter_service
      changed_when: hermes_node_exporter_service.stdout != ""
