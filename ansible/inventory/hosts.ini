# One inventory for every site. Each host is listed in its site group and in
# the role groups the playbooks target. Run one site with --limit site_<site>
# (the Taskfile does this for ENV=<site>).
#
# group_vars/
#   all/          every host: sites.yml (one row per site, and the cross-site
#                 values derived from it) and vars.yml (values worked out for
#                 the host's site, e.g. the DNS/proxy `services` list)
#   site_<site>/  that site's own values: its app registry (apps.yml), its
#                 DNS/proxy entries (proxy/<domain>.yml), sub-folders named
#                 after the group that reads them (they apply to every host of
#                 the site), and all of the site's secrets in one file,
#                 secrets.sops.yml, encrypted for its CI key; groups that run
#                 at one site only have their folder there too

