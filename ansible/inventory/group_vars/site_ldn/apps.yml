---
# --- App Registry (service catalog) ---
# ldn's data-driven apps: images, ports, and proxy/DNS metadata. wil's are in
# site_wil/apps.yml, in the same format. Consumed by:
#   - deploy-app.yml (host_group, nfs/user/group; pre-pull list is derived
#     from all keys ending in `image`, top level and one nesting level down)
#   - compose templates via apps[app_name].<field>
#   - registry_services in group_vars/all/vars.yml, which generates DNS +
#     Caddy entries from each `proxy:` block (backend_host = first host of
#     host_group, backend_port = sibling `port` unless proxy.backend_port
#     overrides)
#
# The Taskfile (ENV=<site>) and CI pass this file via `-e @` for
# deploy-app/deploy-all (needed for the play-level `hosts:` lookup);
# APPS_FILE must keep pointing at the site's file or extra-vars precedence
# will split-brain against the group_vars copy.
#
# Required fields:
#   host_group: inventory group name (e.g., app_website); must have at least one
#               host in the inventory if any proxy block exists
#   image: primary container image (all `*image` keys are pre-pulled)
#
# Optional fields:
#   port: host port published by compose; default proxy backend_port
#   proxy: proxy/DNS entry — name (subdomain), domain, proxied are required;
#          tls_skip_verify / forward_headers / host_header / encode /
#          read_buffer / auth / dns / enabled / backend_port pass through.
#          Omit the block for apps with no DNS/proxy entry.
#   nfs: true — run nfs_mount role before deployment
#   user: override service file owner (default: root)
#   group: override service file group (default: root)
#
# Multi-service apps nest sub-services (see apps.work); sub-keys must be
# hyphen-free. Image keys must end in `image`, be double-quoted, and keep the
# `# renovate: datasource=docker` comment directly above the key line.

apps:
  kosync:
    host_group: app_kosync
    # renovate: datasource=docker
    image: "koreader/kosync:v2.1.1"
    # 17200 is the image's plain-HTTP listener (7200 is self-signed HTTPS);
    # Caddy terminates TLS in front of it. site_wil/proxy/5am.cloud.yml
    # repeats this port for kosync.5am.cloud.
    port: 17200
    # Allows POST /users/create. Set false once your KOReader account exists.
    user_registration: false
    proxy:
      name: kosync
      domain: ldn.5am.cloud
      proxied: true

  # Skips SponsorBlock segments on YouTube TV apps. No web UI, no port, no
  # proxy: it only talks out to YouTube. TVs are paired once by hand (see
  # docs/infrastructure/docker.md).
  isponsorblocktv:
    host_group: app_isponsorblocktv
    # renovate: datasource=docker
    image: "ghcr.io/dmunozv04/isponsorblocktv:v2.11.0"

  work:
    host_group: app_work
    microbin:
      # renovate: datasource=docker
      image: "danielszabo99/microbin:latest"
      port: 8081
      max_file_size_mb: 20480
      proxy:
        name: bin
        domain: ldn.5am.cloud
        proxied: true
    kasm:
      # renovate: datasource=docker
      image: "lscr.io/linuxserver/kasm:1.18.1"
      port: 4443
      wizard_port: 3001
      proxy:
        name: kasm
        domain: ldn.5am.cloud
        proxied: true
        tls_skip_verify: true
        forward_headers: true
    restreamer:
      # renovate: datasource=docker
      image: "datarhei/restreamer:latest"
      port: 8710
      rtmp_port: 1935
      srt_port: 6000
      proxy:
        name: restreamer
        domain: ldn.5am.cloud
        proxied: true
        auth: true
