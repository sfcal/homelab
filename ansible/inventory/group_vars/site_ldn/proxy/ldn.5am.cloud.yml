---
ldn_services:
  # Infrastructure
  # Step-CA: ACME clients and the container's own healthcheck use
  # https://ca.ldn.5am.cloud:9000 directly, so this is a plain A record.
  - name: ca
    backend_host: 10.3.20.9
    backend_port: 9000
    proxied: false
  - name: vm
    backend_host: 10.3.20.10
    backend_port: 8006
    proxied: true
    tls_skip_verify: true
    auth: true
  - name: kvm
    backend_host: 10.3.30.227
    backend_port: 80
    proxied: true
    auth: true
  - name: netboot
    backend_host: 10.3.20.60
    backend_port: 3000
    proxied: true
    auth: true

  # Monitoring
  - name: prometheus
    backend_host: 10.3.20.30
    backend_port: 9090
    proxied: true
    auth: true

  # Haivision
  - name: hmg
    backend_host: 10.3.20.111
    backend_port: 443
    proxied: false
  - name: kr
    backend_host: 10.3.20.248
    backend_port: 443
    proxied: false

  # Apps (registry apps live in site_ldn/apps.yml)

  # Kasm (custom playbook: playbooks/apps/kasm); port is kasm_port
  - name: kasm
    backend_host: 10.3.20.50
    backend_port: 4443
    proxied: true
    tls_skip_verify: true
    forward_headers: true
    # Kasm's service worker cuts Firefox downloads off after 30 s
    no_service_worker: true

  # Cloud gaming (custom playbook: playbooks/apps/gaming)
  - name: roms
    backend_host: 10.3.20.55
    backend_port: 8085
    proxied: true
    forward_headers: true
    auth: true
  # Steam Headless: Moonlight and the browser stream talk to the VM itself
  # (Sunshine's ports, 8483 tcp and udp), so a plain A record, never through
  # Caddy. Web interface: https://steam.ldn.5am.cloud:8483
  - name: steam
    backend_host: 10.3.20.55
    backend_port: 8483
    proxied: false
