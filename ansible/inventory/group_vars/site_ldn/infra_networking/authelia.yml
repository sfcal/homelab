---
# Single sign-on: Authelia (login page) and oauth2-proxy (login check for Caddy)
# Both run next to Caddy. Services opt in with `auth: true` in the proxy service
# lists; the `auth` entry there is the site's login page.

# renovate: datasource=docker
authelia_image: "authelia/authelia:4.39.28"
# renovate: datasource=docker
oauth2_proxy_image: "quay.io/oauth2-proxy/oauth2-proxy:v7.15.6"

# Login user
authelia_user: sfcal
# Stored in site_ldn/secrets.sops.yml:
#   authelia_password_hash, authelia_storage_encryption_key,
#   authelia_oidc_hmac_secret, authelia_oidc_private_key,
#   authelia_oidc_client_secret, authelia_oidc_client_secret_hash,
#   authelia_oidc_kasm_client_secret_hash,
#   authelia_oidc_proxmox_client_secret, authelia_oidc_proxmox_client_secret_hash,
#   oauth2_proxy_cookie_secret
