---
# Stacks of the gaming playbook (playbooks/apps/gaming) on this host: each one
# is deployed only when its image is defined below. ldn runs RomM and Steam
# Headless.

# --- Steam Headless (Steam desktop in a browser, Moonlight, Remote Play) ---
# Web interface: https://<the VM's address>:8483
# renovate: datasource=docker
steam_headless_image: "josh5/steam-headless:2"

# --- ROM library (RomM's; RetroDECK in Steam Headless reads it) ---
# Local to the VM's disk. To serve it from a NAS instead, set
# `gaming_nfs: true` here, put the mount in site_ldn/nfs.yml (see
# site_wil/nfs.yml) and point this at the mount.
romm_library_path: "/srv/romm/library"  # RomM: roms/<platform>/<game>, bios/<platform>

# --- RomM configuration ---
romm_user: root
romm_group: root
romm_deploy_path: "/opt/romm"   # compose + config.yml
romm_data_path: "/var/lib/romm"       # db, resources, redis, assets
romm_port: 8085
# Public URL (behind Caddy TLS): invite links, QR codes, secure session cookies.
romm_base_url: "https://roms.ldn.5am.cloud"

# Container images
# renovate: datasource=docker
romm_image: "rommapp/romm:5.4.1"
# renovate: datasource=docker
romm_db_image: "mariadb:13.0"
