---
# Monitoring Stack container configuration

# User/group IDs
monitoring_uid: "1000"
monitoring_gid: "1000"
monitoring_user: root
monitoring_group: root

# Container images
# renovate: datasource=docker
prometheus_image: "prom/prometheus:v3.16.0"
# renovate: datasource=docker
node_exporter_image: "prom/node-exporter:v1.12.1"

# Directories to back up (relative to /var/lib/monitoring)
backup_targets:
  - prometheus
  - uptime-kuma
