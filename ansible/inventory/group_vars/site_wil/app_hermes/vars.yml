---
# Hermes runs on the Mac mini, installed directly on macOS. Nothing is pinned
# here: each deploy moves Hermes, its web UI, Claude Code and the plugin to
# their current release.

# --- fastmail-triage ---
hermes_fastmail_deliver: telegram

# --- grist ---
# Grist's own port on ldn's work VM. wil can't read ldn's registry, so this
# repeats apps.work.grist.port from site_ldn/apps.yml: change both.
hermes_grist_port: 8484

# --- node-exporter ---
# The Mac has no package for it: the playbook installs this release under
# ~/.local/bin. The checksum is the darwin-arm64 line of the release's
# sha256sums.txt.
hermes_node_exporter_version: "1.12.1"
hermes_node_exporter_sha256: "35b246a34af55a8f0c3f11067f17aecf9836cfd4689bde364776b3a4ad3a84d6"
