---
# Hermes runs on the Mac mini in two containers (OrbStack). Merge the two
# image bumps together where you can: each web UI release is tested against
# the agent release of the same date. Claude Code and the plugin aren't
# pinned: each deploy moves them to their current release.
# renovate: datasource=docker
hermes_image: "nousresearch/hermes-agent:v0.23.1"
# renovate: datasource=docker
hermes_webui_image: "ghcr.io/nesquena/hermes-webui:0.52.761"

# --- browser ---
# The Chromium that Hermes drives, and the small proxy in front of its
# DevTools port.
# renovate: datasource=docker
hermes_chrome_image: "lscr.io/linuxserver/chromium:7b8e918f-ls63"
# renovate: datasource=docker
hermes_chrome_proxy_image: "nginx:1.31-alpine"
# The browser goes out through Squid on ldn's web VM, so sites see ldn's
# address. wil can't read ldn's registry, so this repeats apps.squid.port
# from site_ldn/apps.yml: change both.
hermes_squid_port: 3128

# --- grist ---
# Grist's own port on ldn's work VM. wil can't read ldn's registry, so this
# repeats apps.work.grist.port from site_ldn/apps.yml: change both.
hermes_grist_port: 8484

# --- node-exporter ---
# Runs on macOS itself. The Mac has no package for it: the playbook installs
# this release under ~/.local/bin. The checksum is the darwin-arm64 line of
# the release's sha256sums.txt.
hermes_node_exporter_version: "1.12.1"
hermes_node_exporter_sha256: "35b246a34af55a8f0c3f11067f17aecf9836cfd4689bde364776b3a4ad3a84d6"
