---
# Single sign-on: oauth2-proxy answers Caddy's login check next to Caddy and
# signs users in with Kanidm on the VPS (https://auth.5am.cloud, client
# oauth2-proxy-<site>). Services opt in with `auth: true` in the proxy service
# lists. See docs/infrastructure/networking/sso.md.

# renovate: datasource=docker
oauth2_proxy_image: "quay.io/oauth2-proxy/oauth2-proxy:v7.15.6"

# Stored in site_wil/secrets.sops.yml:
#   oauth2_proxy_cookie_secret,
#   kanidm_oauth2_proxy_client_secret, kanidm_sync_token, kanidm_proxmox_client_secret,
#   kanidm_pbs_client_secret
