---
# DNS Server (BIND9) configuration
# Trusted networks, secondary zones, zone transfers and notifies are derived
# from all/sites.yml.

dns_forwarders:
  - "1.1.1.1"
  - "1.0.0.1"

# --- Forward Zones ---
# The haivision OpenVPN session lives on the ldn networking VM, so wil has no
# direct path to Haivision internal DNS. Forward the zone to ldn's BIND9, which
# forwards on to 10.65.0.10/10.66.0.10 through its tunnel.
#
# Set here explicitly rather than relying on vpn_clients aggregation: that only
# collects dns_forward_zones from clients with `enabled: true`, so wil's
# disabled client contributes nothing.
dns_forward_zones:
  - name: "haivision.com"
    forwarders: "{{ sites.ldn.dns }}"

# Reverse Proxy IP (used for DNS A records of proxied services)
reverse_proxy_ip: "10.2.20.53"

# Reverse DNS zone name (derived from subnet)
dns_reverse_zone: "20.2.10.in-addr.arpa"

# Reverse Zone PTR Records
dns_ptr_records:
  - octet: "9"
    hostname: "ca.wil.5am.cloud."
  - octet: "53"
    hostname: "dns.wil.5am.cloud."
  - octet: "123"
    hostname: "time.wil.5am.cloud."
