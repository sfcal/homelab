---
# Tailscale Subnet Router configuration
tailscale_mode: "subnet_router"

# tailscale_auth_key — stored in site_wil/secrets.sops.yml
# Generate: Tailscale Admin -> Settings -> Keys -> Generate auth key (Reusable + Pre-approved)

# Routes to advertise to the Tailscale network: the site's LAN (sites.yml), then
# the subnets of every VPN client enabled on this VM (vpn_clients.yml; none
# while ldn holds the Haivision session). New routes must be approved in the
# Tailscale admin console.
tailscale_advertise_routes: >-
  {{ [sites[site].cidr]
     + (vpn_clients | default([]) | selectattr('enabled') | map(attribute='routed_subnets') | flatten) }}

# Accept routes from other subnet routers (enables cross-site routing)
tailscale_accept_routes: true

# Subnet router should not accept DNS from Tailscale
tailscale_accept_dns: false

# Hostname as it appears in Tailscale admin console
tailscale_hostname: "wil-gateway"

# Set to true to force re-authentication on next run
tailscale_force_reauth: false
