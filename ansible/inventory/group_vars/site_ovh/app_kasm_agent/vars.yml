---
# --- Kasm agent ---
# A second Docker agent for ldn's Kasm (work VM 10.3.20.50, LinuxServer image).
# Kasm places the Deluge workspace here; the other container workspaces are
# restricted to the work VM's agent in Kasm's admin (its database, not here).
# Must match the Kasm version on the work VM (site_ldn/app_kasm/vars.yml, kasm_image).
kasm_agent_version: "1.18.1"
# sha256 of kasm_release_1.18.1.tar.gz. Its install.sh and agent files are the
# same as the release inside the work VM's Kasm container (checked 2026-11-07).
kasm_agent_release_sha256: "83d3b1d61a32f283b1b8e415ee4d1bbb02184930d00f6885f9799e001e677135"

# The agent registers with Kasm on the work VM (the app_kasm host), over the
# tailnet
kasm_agent_manager: "{{ groups['app_kasm'] | first }}"

# Kasm reaches the agent at the VPS's tailnet address (sites.yml; the ldn UDM
# routes it to ldn-gateway). The installer uses one port for the agent and for
# Kasm, so it is Kasm's (kasm_port). Dropped on the public interface.
kasm_agent_public_hostname: "{{ sites.ovh.tailnet_ip }}"
kasm_agent_port: 4443

# Custom workspace images (folders of playbooks/apps/kasm/files/) built in the
# VPS's Docker, for the workspaces restricted to this agent in Kasm's admin
kasm_workspace_images:
  - deluge

# kasm_manager_token — site_ovh/secrets.sops.yml (section app_kasm_agent)
