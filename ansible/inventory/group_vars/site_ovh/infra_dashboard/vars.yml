---
# --- Homepage ---
# One dashboard for both sites, on the OVH VPS. Tailnet only: http://dashboard/
# (tailscale serve in front of 127.0.0.1:3002). Use the short name: Chrome tries
# HTTPS first for full names, and the tailnet has HTTPS certificates off.
# API keys: group_vars/site_ovh/secrets.sops.yml

# renovate: datasource=docker
homepage_image: "ghcr.io/gethomepage/homepage:latest"
homepage_allowed_hosts: "dashboard.tail1e494e.ts.net,dashboard"

# --- Uptime Kuma ---
# Admin page on the tailnet only: http://dashboard:3001. Caddy serves only its
# badges to the internet, at https://uptime.ext.5am.cloud/api/badge/... (for
# the README). That name has a DNS-only record in Cloudflare and an entry in
# wil's BIND (site_wil/proxy/ext.5am.cloud.yml), both pointing at this VPS.

# renovate: datasource=docker
uptime_kuma_image: "louislam/uptime-kuma:2.5.9"
# Caddy is built from networking/templates/Dockerfile.j2, pinned there.

# --- Grafana ---
# One Grafana for both sites, tailnet only: http://dashboard:3000 (tailscale
# serve in front of 127.0.0.1:3000). Prometheus stays on each site's monitoring
# VM; Grafana reads both over the tailnet. Anyone on the tailnet can view;
# sign in as admin to edit.
# grafana_admin_password — site_ovh/secrets.sops.yml (section infra_dashboard)

# renovate: datasource=docker
grafana_image: "grafana/grafana:13.3.0"
grafana_admin_user: admin
grafana_url: "http://dashboard:3000"

# --- Kanidm ---
# One login for both sites, tailnet only: https://auth.5am.cloud. Upgrades go
# one minor version at a time and can't be undone, so Renovate doesn't
# automerge this image (renovate.json).

# renovate: datasource=docker
kanidm_image: "kanidm/server:1.12.0"
# kanidm-mail-sender, which emails password reset links. Keep it at the
# server's version: Renovate moves both in one pull request.
# kanidm_mail_sender_token, kanidm_mail_username, kanidm_mail_password:
# site_ovh/secrets.sops.yml (section infra_kanidm_email)
# renovate: datasource=docker
kanidm_tools_image: "kanidm/tools:1.12.0"
