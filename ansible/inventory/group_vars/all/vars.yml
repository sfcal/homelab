---
# Global variables (every site). The site's row in sites.yml fills these in.

# Domains managed by DNS and reverse proxy
domains: "{{ sites[site].zones | map('community.general.dict_kv', 'name') | list }}"
system_timezone: "{{ sites[site].tz }}"

# Host filesystem layout follows the FHS and is hard-coded in the playbooks:
#   /opt/<project>                compose files, Dockerfiles, Ansible-rendered config
#   /var/lib/<project>/<service>  state the containers write (databases, caches, uploads)
#   /var/log/<project>            log files
#   /srv/<project>                files served to clients (boot images, ROM library)

# --- Proxy/DNS services ---
# The unified `services` list (consumed by domain.zone.j2 and Caddyfile.j2 on
# the networking host) is built from two sources in the host's site folder,
# then cut down to the zones of the host's site (sites.yml):
#   1. Manual per-domain lists (site_<site>/proxy/<domain>.yml) — services
#      OUTSIDE the app registry: Proxmox/NAS/KVM/Haivision devices, media
#      stack, monitoring, frigate, GitHub Pages.
#   2. registry_services — generated from the site's registry
#      (site_<site>/apps.yml). Every
#      `proxy:` block (top-level app or one-level-nested sub-service, e.g.
#      apps.work.microbin.proxy) emits one entry. backend_host is the first
#      inventory host of the app's host_group; backend_port is the sibling
#      `port` unless the proxy block sets backend_port.
#
# Entry fields (manual or generated):
#   name            (required) - subdomain name
#   backend_host    (required) - IP of the backend service
#   backend_port    (required) - port of the backend service
#   proxied         (required) - true: routed through Caddy, DNS -> reverse_proxy_ip
#                                false: DNS -> backend_host directly, no Caddy entry
#   dns             (optional) - "external" skips A record generation (default: "internal")
#   enabled         (optional) - false skips both DNS and Caddy (default: true)
#   tls_skip_verify (optional) - true: backend uses HTTPS with self-signed cert
#   forward_headers (optional) - true: adds X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
#   host_header     (optional) - "upstream": adds Host header override
#   encode          (optional) - encoding type, e.g. "gzip"
#   read_buffer     (optional) - transport read buffer size in bytes
#   no_service_worker (optional) - true: Caddy serves a do-nothing /serviceworker.js
#                                in place of the backend's (Kasm; see proxy docs)
#   auth         (optional) - true: Caddy asks oauth2-proxy, which signs the user in
#                                with Kanidm (auth.5am.cloud), before proxying. Works on any domain.

# Registry-derived entries.
# {% %} loops force string output, so emit JSON and parse it back.
# An app whose host_group has no hosts in this inventory fails the render
# loudly rather than silently dropping its DNS/Caddy entries.
registry_services: "{{ registry_services_json | from_json }}"

registry_services_json: >-
  {%- set out = [] -%}
  {%- for app_key, app in (apps | default({})).items() -%}
  {%-   set proxied_svcs = ([app] if app.proxy is defined else [])
          + (app.values() | selectattr('proxy', 'defined') | list) -%}
  {%-   if proxied_svcs | length > 0 -%}
  {%-     set backend_host = (groups[app.host_group] | default([]) | first)
            | mandatory('apps.' ~ app_key ~ ': host_group "' ~ app.host_group
                        ~ '" has no hosts in this inventory') -%}
  {%-     for svc in proxied_svcs -%}
  {%-       set _ = out.append(
              {'backend_host': backend_host,
               'backend_port': svc.proxy.backend_port | default(svc.port)}
              | combine(svc.proxy)) -%}
  {%-     endfor -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ out | to_json }}

# Aggregation.
# Manual lists first (keeps zone/Caddyfile ordering stable), registry last,
# then only the entries for zones this host's site is primary for.
services: >-
  {{
    (
      (video_services | default([]) | map('combine', {'domain': '5am.video'}) | list) +
      (cloud_services | default([]) | map('combine', {'domain': '5am.cloud'}) | list) +
      (wil_services | default([]) | map('combine', {'domain': 'wil.5am.cloud'}) | list) +
      (ext_services | default([]) | map('combine', {'domain': 'ext.5am.cloud'}) | list) +
      (sfc_services | default([]) | map('combine', {'domain': 'sfc.al'}) | list) +
      (ldn_services | default([]) | map('combine', {'domain': 'ldn.5am.cloud'}) | list) +
      registry_services
    ) | selectattr('domain', 'in', sites[site].zones) | list
  }}
