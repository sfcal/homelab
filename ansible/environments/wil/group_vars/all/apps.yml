---
# --- App Registry (service catalog) ---
# Single source of truth for data-driven apps: images, ports, and proxy/DNS
# metadata. Consumed by:
#   - deploy-app.yml (host_group, nfs/user/group; pre-pull list is derived
#     from all keys ending in `image`, top level and one nesting level down)
#   - compose templates via apps[app_name].<field>
#   - proxy/_services.yml, which generates DNS + Caddy entries from each
#     `proxy:` block (backend_host = first host of host_group,
#     backend_port = sibling `port` unless proxy.backend_port overrides)
#
# The Taskfile passes this file via `-e @` for deploy-app/deploy-all (needed
# for the play-level `hosts:` lookup); APPS_FILE must keep pointing here or
# extra-vars precedence will split-brain against the group_vars copy.
#
# Required fields:
#   host_group: inventory group name (e.g., app_website); must have at least one
#               host in this environment's inventory if any proxy block exists
#   image: primary container image (all `*image` keys are pre-pulled)
#
# Optional fields:
#   port: host port published by compose; default proxy backend_port
#   proxy: proxy/DNS entry — name (subdomain), domain, proxied are required;
#          tls_skip_verify / forward_headers / host_header / encode /
#          read_buffer / dns / enabled / backend_port pass through.
#          Omit the block for apps with no DNS/proxy entry.
#   nfs: true — run nfs_mount role before deployment
#   user: override service file owner (default: root)
#   group: override service file group (default: root)
#
# Multi-service apps nest sub-services (see apps.work in ldn); sub-keys must be
# hyphen-free. Image keys must end in `image`, be double-quoted, and keep the
# `# renovate: datasource=docker` comment directly above the key line.

apps:
  birdle:
    host_group: app_birdle
    # renovate: datasource=docker
    image: "ghcr.io/sfcal/new-birdle:latest"
    port: 8091
    proxy:
      name: birdle
      domain: sfc.al
      proxied: true

  games-server:
    host_group: app_gamesserver
    terraria:
      # renovate: datasource=docker
      image: "ryshe/terraria:latest"
      port: 7777
      maxplayers: 8
      worldname: "TerrariaWorld"
      worldsize: 3
      difficulty: 0
      motd: "Welcome to the Terraria server!"
      language: "en-US"
      npcstream: 60
      seed: ""

  restreamer:
    host_group: app_restreamer
    # renovate: datasource=docker
    image: "datarhei/restreamer:latest"
    port: 8710
    rtmp_port: 1935
    srt_port: 6000
    proxy:
      name: restreamer
      domain: 5am.video
      proxied: true

  website:
    host_group: app_website
    # renovate: datasource=docker
    image: "ghcr.io/sfcal/samuel.computer:latest"
    port: 8090
    proxy:
      name: samuel
      domain: 5am.video
      proxied: true

