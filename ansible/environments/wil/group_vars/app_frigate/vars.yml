---
# Frigate configuration

# User/group IDs
frigate_puid: "999"
frigate_pgid: "987"
frigate_render_gid: "993"
frigate_user: root
frigate_group: root

# Paths: compose + build context under /opt; Frigate's config dir
# (config.yml, its database, model cache) is state.
frigate_deploy_path: "/opt/frigate"
frigate_data_path: "/var/lib/frigate"

# Container image (base image for multi-stage build)
# renovate: datasource=docker
frigate_image: "ghcr.io/blakeblackshear/frigate:0.16.4"
