---
# --- App Registry (service catalog) ---
# See wil's apps.yml for full schema docs.

apps:
  kosync:
    host_group: app_kosync
    # renovate: datasource=docker
    image: "koreader/kosync:v2.1.1"
    # 17200 is the image's plain-HTTP listener (7200 is self-signed HTTPS);
    # Caddy terminates TLS in front of it.
    port: 17200
    # Allows POST /users/create. Set false once your KOReader account exists.
    user_registration: false
    proxy:
      name: kosync
      domain: ldn.5am.cloud
      proxied: true

  work:
    host_group: app_work
    microbin:
      # renovate: datasource=docker
      image: "danielszabo99/microbin:latest"
      port: 8081
      max_file_size_mb: 20480
      proxy:
        name: bin
        domain: ldn.5am.cloud
        proxied: true
    kasm:
      # renovate: datasource=docker
      image: "lscr.io/linuxserver/kasm:1.18.1"
      port: 4443
      wizard_port: 3001
      proxy:
        name: kasm
        domain: ldn.5am.cloud
        proxied: true
        tls_skip_verify: true
        forward_headers: true
    restreamer:
      # renovate: datasource=docker
      image: "datarhei/restreamer:latest"
      port: 8710
      rtmp_port: 1935
      srt_port: 6000
      proxy:
        name: restreamer
        domain: ldn.5am.cloud
        proxied: true
