---
ldn_services:
  # Infrastructure
  # Step-CA: ACME clients and the container's own healthcheck use
  # https://ca.ldn.5am.cloud:9000 directly, so this is a plain A record.
  - name: ca
    backend_host: 10.3.20.9
    backend_port: 9000
    proxied: false
  - name: vm
    backend_host: 10.3.20.10
    backend_port: 8006
    proxied: true
    tls_skip_verify: true
  - name: kvm
    backend_host: 10.3.30.227
    backend_port: 80
    proxied: true
  - name: netboot
    backend_host: 10.3.20.60
    backend_port: 3000
    proxied: true

  # Monitoring
  - name: grafana
    backend_host: 10.3.20.30
    backend_port: 3000
    proxied: true
  - name: prometheus
    backend_host: 10.3.20.30
    backend_port: 9090
    proxied: true
  - name: homepage
    backend_host: 10.3.20.30
    backend_port: 3002
    proxied: true

  # Haivision
  - name: hmg
    backend_host: 10.3.20.111
    backend_port: 443
    proxied: false
  - name: kr
    backend_host: 10.3.20.248
    backend_port: 443
    proxied: false

  # Apps (registry apps live in group_vars/all/apps.yml)

  # Cloud gaming (custom playbook: playbooks/apps/gaming)
  - name: roms
    backend_host: 10.3.20.55
    backend_port: 8085
    proxied: true
    forward_headers: true
  # Moonlight needs direct TCP/UDP access to Wolf (47984, 47989, 47999, 48010,
  # 48100, 48200): plain A record, never through Caddy. Pairing page:
  # http://wolf.ldn.5am.cloud:47989/pin/
  - name: wolf
    backend_host: 10.3.20.55
    backend_port: 47989
    proxied: false
