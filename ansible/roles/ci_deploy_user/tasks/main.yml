---
- name: Check the CI deploy key is configured.
  ansible.builtin.assert:
    that:
      - ci_deploy_ssh_pubkey | length > 0
      - ci_deploy_ssh_from | length > 0
    fail_msg: >-
      ci_deploy_ssh_pubkey or ci_deploy_ssh_from is empty. Run
      `task ci:keys ENV=<env>` to generate the key and fill in
      environments/<env>/group_vars/all/ci.yml.

- name: Create the CI deploy user.
  ansible.builtin.user:
    name: "{{ ci_deploy_user }}"
    shell: /bin/bash
    create_home: true
    password_lock: true

# Every playbook runs with become: true, so the deploy user needs the same
# passwordless sudo as the interactive user.
- name: Grant the CI deploy user passwordless sudo.
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ ci_deploy_user }}"
    content: "{{ ci_deploy_user }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Install the CI deploy key (tailnet-only via from=).
  ansible.posix.authorized_key:
    user: "{{ ci_deploy_user }}"
    key: "{{ ci_deploy_ssh_pubkey }}"
    key_options: 'from="{{ ci_deploy_ssh_from }}",no-agent-forwarding,no-port-forwarding,no-X11-forwarding'
    exclusive: true
