creation_rules:
  - path_regex: kubernetes/.*\.sops\.ya?ml
    encrypted_regex: "^(data|stringData)$"
    age: age14kkq0ymnjz35dsu4mq6jvc3ne2n9vxf64aynxne7y6k7kd0ndplqlyu6m8
  - path_regex: kubernetes/.*secrets?\.ya?ml
    encrypted_regex: "^(data|stringData)$"
    age: age14kkq0ymnjz35dsu4mq6jvc3ne2n9vxf64aynxne7y6k7kd0ndplqlyu6m8
  - path_regex: terraform/.*\.tfvars
    age: age14kkq0ymnjz35dsu4mq6jvc3ne2n9vxf64aynxne7y6k7kd0ndplqlyu6m8
  - path_regex: packer/.*\.pkrvars\.hcl
    age: age14kkq0ymnjz35dsu4mq6jvc3ne2n9vxf64aynxne7y6k7kd0ndplqlyu6m8
  # Per-site Ansible secrets: master key + that site's CI key, so the deploy
  # workflow can decrypt only its own site. Every secret lives in its site's
  # folder, ansible/inventory/group_vars/site_<site>/; the generic rule below
  # leaves the rest of the inventory out, so sops refuses a secret saved
  # anywhere else instead of encrypting it for the master key only. These must
  # stay above the generic rule (first match wins). `task ci:keys` appends the
  # CI recipient to the line tagged # ci:<env>.
  - path_regex: ansible/inventory/group_vars/site_wil/.*\.sops\.ya?ml
    age: age14kkq0ymnjz35dsu4mq6jvc3ne2n9vxf64aynxne7y6k7kd0ndplqlyu6m8,age1u46hpfwu54vuk7845f82vxcrmhnwqztv37szqee2c0m9t60gmd7svajvj7  # ci:wil
  - path_regex: ansible/inventory/group_vars/site_ldn/.*\.sops\.ya?ml
    age: age14kkq0ymnjz35dsu4mq6jvc3ne2n9vxf64aynxne7y6k7kd0ndplqlyu6m8,age1yrenva8h73x5yyftertvmnultzcdyqy06d57rrd72y69rv7h4s7s7spc3d  # ci:ldn
  # ovh (dashboard VPS): not deployed by CI yet, so master key only
  - path_regex: ansible/inventory/group_vars/site_ovh/.*\.sops\.ya?ml
    age: age14kkq0ymnjz35dsu4mq6jvc3ne2n9vxf64aynxne7y6k7kd0ndplqlyu6m8  # ci:ovh
  - path_regex: (docker|ansible/(playbooks|roles))/.*/(.+\.sops\.ya?ml|cf-token)
    age: age14kkq0ymnjz35dsu4mq6jvc3ne2n9vxf64aynxne7y6k7kd0ndplqlyu6m8
  - path_regex: (docker|ansible)/.*\.env$
    age: age14kkq0ymnjz35dsu4mq6jvc3ne2n9vxf64aynxne7y6k7kd0ndplqlyu6m8