version: '3'

vars:
  HOSTS_FILE: 'inventory/hosts.ini'
  # The site's app registry, passed with -e @ for deploy-app's play-level hosts.
  APPS_FILE: 'inventory/group_vars/site_{{.ENV}}/apps.yml'
  # One inventory holds every site; ENV picks the site to run against. To narrow
  # a run, pass a pattern inside the site, e.g. LIMIT='site_wil:&infra_networking'
  # (a --limit in EXTRA_ARGS would replace the site limit, not narrow it).
  LIMIT: 'site_{{.ENV}}'

tasks:
  # --- Internal Tasks ---

  _deploy:
    internal: true
    dir: '{{.ROOT_DIR}}/ansible'
    cmds:
      - ansible-playbook -i {{.HOSTS_FILE}} --limit '{{.LIMIT}}' playbooks/{{.PLAYBOOK_PATH}} {{.EXTRA_ARGS | default ""}}

  # --- Full Deployment ---

  deploy-all:
    desc: Deploy entire infrastructure in correct order
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: site.yml, EXTRA_ARGS: '-e @{{.APPS_FILE}}' }

  # --- Infrastructure ---

  deploy-networking:
    desc: Deploy networking stack (DNS, reverse proxy, Tailscale)
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: infrastructure/networking/deploy.yml }

  deploy-monitoring:
    desc: Deploy monitoring stack
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: infrastructure/monitoring/deploy.yml }

  deploy-dashboard:
    desc: Deploy the OVH VPS - Homepage, Uptime Kuma, Grafana, Kanidm (ENV=ovh)
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: infrastructure/dashboard/deploy.yml }

  deploy-ca:
    desc: Deploy Step-CA certificate authority
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: infrastructure/ca/deploy.yml }

  deploy-ntp:
    desc: Deploy NTP time server (Chrony)
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: infrastructure/ntp/deploy.yml }

  deploy-netboot:
    desc: Deploy netboot.xyz PXE re-imaging service
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: infrastructure/netboot/deploy.yml }

  deploy-proxmox:
    desc: Configure Proxmox hosts (SR-IOV GPU VFs at boot)
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: infrastructure/proxmox/deploy.yml }

  # --- Applications ---

  deploy-app:
    desc: "Deploy an app by name (APP=<name>)"
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: deploy-app.yml, EXTRA_ARGS: '-e app_name={{.APP}} -e @{{.APPS_FILE}}' }

  deploy-media:
    desc: Deploy media stack
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: apps/media/deploy.yml }

  deploy-homeassistant:
    desc: Deploy Home Assistant
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: apps/homeassistant/deploy.yml }

  deploy-frigate:
    desc: Deploy Frigate NVR
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: apps/frigate/deploy.yml }

  deploy-gaming:
    desc: Deploy gaming stacks (Terraria, Wolf, RomM)
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: apps/gaming/deploy.yml }

  deploy-hermes:
    desc: Deploy Hermes Agent
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: apps/hermes/deploy.yml }

  deploy-kasm:
    desc: Deploy Kasm and build its workspace images (ENV=ldn)
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: apps/kasm/deploy.yml }

  deploy-kasm-agent:
    desc: Deploy the Kasm agent on the OVH VPS (ENV=ovh)
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: apps/kasm-agent/deploy.yml }

  # --- CI ---

  deploy-ci-access:
    desc: Create the CI deploy user on hosts the deploy workflow targets
    cmds:
      - task: _deploy
        vars: { PLAYBOOK_PATH: ci-access.yml }

  # --- Utility Tasks ---

  ping:
    desc: Ping all hosts of the site
    dir: '{{.ROOT_DIR}}/ansible'
    cmds:
      - ansible -i {{.HOSTS_FILE}} '{{.LIMIT}}' -m ping
